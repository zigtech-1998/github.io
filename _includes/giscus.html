<!-- Giscus Comments -->
<!-- To enable comments:
     1. Go to https://github.com/zigtech-1998/github.io/settings and enable Discussions
     2. Visit https://giscus.app and configure for your repo
     3. Update the data-repo-id and data-category-id below with your values
-->
<div class="comments-section">
  <h3>Comments</h3>
  <script src="https://giscus.app/client.js"
          data-repo="zigtech-1998/github.io"
          data-repo-id="YOUR_REPO_ID"
          data-category="General"
          data-category-id="YOUR_CATEGORY_ID"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="light"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>
</div>
